name: Derleme (Windows / Linux / macOS)

# Uc platformda da PyInstaller ile calistirilabilir paket uretir.
# - push/PR: derler, dumansiz testi kosar, artifact olarak yukler
# - etiket (v*): ayrica GitHub Release'e ekler
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.ad }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ad: Windows (x64)
            artifact: YerIstasyonu2026-windows-x64
          - os: ubuntu-22.04
            ad: Linux (x64)
            artifact: YerIstasyonu2026-linux-x64
          - os: macos-13
            ad: macOS (Intel)
            artifact: YerIstasyonu2026-macos-intel
          - os: macos-14
            ad: macOS (Apple Silicon)
            artifact: YerIstasyonu2026-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          # PyQt6-WebEngine tekerlekleri 3.12'de tum platformlarda mevcut.
          python-version: '3.12'
          cache: pip

      # PyQt6 + WebEngine, basvurmasiz Linux imajlarinda bulunmayan bir dizi
      # sistem kutuphanesine baglidir. Offscreen testi de bunlari ister.
      - name: Linux sistem bagimliliklari
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0 \
            libnss3 libnspr4 libxdamage1 libxrandr2 libxcomposite1 \
            libxtst6 libdbus-1-3 xvfb
          # libasound2 paketi 24.04'te libasound2t64 olarak yeniden adlandi;
          # hangisi varsa onu kur (ikisi de yoksa derlemeyi durdurma).
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Python bagimliliklari
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Derle
        run: pyinstaller --noconfirm --clean YerIstasyonu2026.spec

      # Uretilen ikiliyi gercekten calistir: Qt yukleniyor mu, arayuz kuruluyor
      # mu, harita kaynaklari pakete girmis mi. Sadece "dosya olustu" demiyoruz.
      - name: Dumansiz test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          # WebEngine sandbox'i CI konteynerinde calismaz.
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        run: xvfb-run -a ./dist/YerIstasyonu2026/YerIstasyonu2026 --check

      - name: Dumansiz test (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        run: ./dist/YerIstasyonu2026/YerIstasyonu2026 --check

      - name: Dumansiz test (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox --disable-gpu
        run: .\dist\YerIstasyonu2026\YerIstasyonu2026.exe --check

      # macOS'ta .app paketini de sakla; zip'lemek calistirma bitlerini korur.
      - name: macOS .app paketle
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --keepParent YerIstasyonu2026.app YerIstasyonu2026-app.zip

      # macOS'ta .app, onedir agacinin kopyasini icerir; ikisini birden
      # yuklemek artifact'i iki katina cikarir. Sadece .app zip'i gonderilir.
      - name: Artifact yukle (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/YerIstasyonu2026-app.zip
          if-no-files-found: error
          retention-days: 30

      - name: Artifact yukle (Windows / Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/YerIstasyonu2026/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release'e ekle
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: indirilen

      # macOS artifact'i zaten tek bir .zip (ditto ile uretildi) — onu oldugu
      # gibi al, yeniden zip'leme (yoksa kullanici ic ice iki zip acar).
      # Windows/Linux ise klasor olarak iniyor; onlari zip'le.
      - name: Arsivle
        run: |
          set -euo pipefail
          mkdir -p cikti
          for d in indirilen/*/; do
            ad="$(basename "$d")"
            ic_zip="$(find "$d" -maxdepth 1 -name '*.zip' -print -quit)"
            if [ -n "$ic_zip" ]; then
              mv "$ic_zip" "cikti/${ad}.zip"
            else
              (cd "$d" && zip -qr "$OLDPWD/cikti/${ad}.zip" .)
            fi
          done
          ls -lh cikti

      - name: Release olustur
        uses: softprops/action-gh-release@v2
        with:
          files: cikti/*.zip
          generate_release_notes: true
